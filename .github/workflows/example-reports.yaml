# Regenerates the two example reports on the pkgdown site from the Fake NHS
# Trust synthetic dataset and commits them to pkgdown/assets/ on main. Run by
# hand from the Actions tab; the pkgdown workflow then publishes them.
on:
  workflow_dispatch:
    inputs:
      scale:
        description: Dataset scale (the full set is about 1.1 GB)
        type: choice
        options: [full, sample]
        default: full
      sample_rows:
        description: Row threshold above which the sampled report samples a table
        default: "1000000"

name: example-reports

permissions:
  contents: write
  actions: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      FH_SCALE: ${{ inputs.scale }}
      FH_SAMPLE_ROWS: ${{ inputs.sample_rows }}
      FAKEHOSPDATA_CACHE: ${{ github.workspace }}/.fakehospdata-cache
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::DT, any::duckdb, any::quarto, ThomUK/synthetic-hospital-data/fakehospdata, local::.
          needs: website

      - name: Cache the dataset
        uses: actions/cache@v4
        with:
          path: .fakehospdata-cache
          key: fakehospdata-v2-${{ inputs.scale }}

      - name: Render the example reports
        run: source("pkgdown/render_example_reports.R")
        shell: Rscript {0}

      - name: Commit the reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pkgdown/assets/example-report-*.html pkgdown/assets/example-reports.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Regenerate example reports (${FH_SCALE} set, sampled above ${FH_SAMPLE_ROWS} rows)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      # A push made with the workflow token does not start push-triggered
      # workflows, so the site build is dispatched explicitly.
      - name: Rebuild the site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pkgdown.yaml --ref main
